services:
  izuku-bot:
    build: .
    container_name: izuku-bot
    restart: unless-stopped
    stdin_open: true      # necesario para escribir el numero del pairing code
    tty: true
    ports:
      - "3000:3000"        # panel web (http://localhost:3000)
    environment:
      - TZ=America/Montevideo
      - PANEL_ENABLED=true
      # Cambia esta clave (o bórrala y el bot generará una y la mostrará en los logs)
      - PANEL_PASSWORD=${PANEL_PASSWORD:-izuku-panel}
      # Guarda todo en un disco persistente (por defecto, junto al proyecto)
      - DATA_DIR=${DATA_DIR:-/app}
    volumes:
      - ./sessions:/app/sessions
      - ./subbots:/app/subbots
      - ./database:/app/database
      - ./media:/app/media
      - ./config.js:/app/config.js
    deploy:
      resources:
        limits:
          memory: 1G
