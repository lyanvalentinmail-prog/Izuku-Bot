services:
  izuku-bot:
    build: .
    container_name: izuku-bot
    restart: unless-stopped
    stdin_open: true      # necesario para escribir el numero del pairing code
    tty: true
    ports:
      - "3000:3000"       # panel de control: http://localhost:3000
    environment:
      - TZ=America/Montevideo
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
    volumes:
      - ./sessions:/app/sessions
      - ./subbots:/app/subbots
      - ./database:/app/database
      - ./media:/app/media
      - ./config.js:/app/config.js
    deploy:
      resources:
        limits:
          memory: 1G
